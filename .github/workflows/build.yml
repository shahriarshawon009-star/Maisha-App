name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies and Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/local-notifications
          npx cap init "Maisha Life Hub" com.maisha.lifehub --web-dir www
          npm install @capacitor/android
          npx cap add android
          npx cap sync

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Maisha-Life-Hub-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
